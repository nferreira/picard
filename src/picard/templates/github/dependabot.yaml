# Dependabot titles are `chore(deps): ...`, which .picard/pipeline.toml routes to the `deps` profile
# (dependency review, then the baseline tier). Keep the update PRs grouped so each one runs
# the pipeline once.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      github-actions:
        patterns: ["*"]
