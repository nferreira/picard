name: Pipeline · Release

# Tier 5. Every push to main refreshes one rolling Release PR built from the Conventional
# Commit titles merged since the last tag. Merging that PR bumps the version, updates
# CHANGELOG.md and creates the vX.Y.Z tag and GitHub Release. So the commit type decides the
# next version: feat is minor, fix and perf are patch, a breaking change is major (minor below
# 1.0, see bump-minor-pre-major in .github/release-please/config.json).
#
# Setup: a GitHub App with contents and pull-requests write, its ID in the repository variable
# RELEASE_APP_ID and its private key in the secret RELEASE_APP_PRIVATE_KEY. The App token is
# needed because tags created with the default GITHUB_TOKEN never trigger other workflows, so
# a deploy listening for tags would never start.

on:
  push:
    branches: [main]

concurrency:
  group: pipeline-release
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-24.04
    outputs:
      release_created: ${{ steps.rp.outputs.release_created }}
      tag_name: ${{ steps.rp.outputs.tag_name }}
      version: ${{ steps.rp.outputs.version }}
    steps:
      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: rp
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: .github/release-please/config.json
          manifest-file: .github/release-please/manifest.json

  # Add your own publish or deploy job here. It runs only when this push merged a Release PR:
  # publish:
  #   needs: release-please
  #   if: needs.release-please.outputs.release_created == 'true'
  #   runs-on: ubuntu-24.04
  #   steps:
  #     - run: echo "released ${{ needs.release-please.outputs.tag_name }}"
